name: Get Satisfaction
description: >-
  Get Satisfaction was a customer-community and engagement SaaS platform that gave companies
  a hosted online community where customers, employees, and prospects could ask questions,
  report problems, share ideas, and offer praise in public topic threads. Founded in 2007,
  it popularized the customer-powered support community model and offered widgets, community
  moderation, and integrations that companies embedded on their websites and product pages.
  Get Satisfaction was acquired by the social customer experience management company Sprinklr
  in 2015 and folded into Sprinklr's platform; the standalone product and its developer
  program have since been discontinued. This profile is retained in the API Evangelist network
  as a historical portfolio-company record (backed by Uncork Capital); it no longer operates a
  live public API, developer portal, or documentation surface.
